name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The client bundle is committed, so this only proves it is reproducible and current.
      - name: rebuild client bundle
        run: pnpm run build

      # Offline only. test-serve.mjs and probe-model.mjs need a live provider and are not run here.
      - name: assertions
        run: pnpm test

      - name: package payload
        run: npm pack --dry-run
